[project]
name = "shopintel-backend"
version = "0.1.0"
description = "ShopIntel Backend API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
