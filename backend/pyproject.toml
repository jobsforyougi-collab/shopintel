[project]
name = "shopintel-backend"
version = "0.1.0"
description = "ShopIntel Backend API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]